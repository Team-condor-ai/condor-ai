name: Analizador de campaña Meta

on:
  schedule:
    # 1 vez al día: 00:00 UTC (~9 PM Chile invierno / 8 PM Perú)
      - cron: '0 0 * * *'
  workflow_dispatch:   # botón para correrlo a mano y probar

permissions:
  contents: write

jobs:
  analizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Analizar campañas y avisar por Telegram
        run: node services/meta-analyzer/meta-analyzer.mjs
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Guardar memoria de campaña
        run: |
          git config user.name "condor-bot"
          git config user.email "bot@condorai.cl"
          if git diff --quiet services/meta-analyzer/campaign-log.json; then echo "sin cambios"; else
            git add services/meta-analyzer/campaign-log.json
            git commit -m "meta: memoria de campaña $(date +%Y-%m-%d_%H%M)"
            OK=0
            for n in 1 2 3; do
              if git pull --rebase origin main && git push; then OK=1; break; fi
              sleep 5
            done
            # EL BUG QUE ROMPIO A BARBARA EL 22-AGO: antes esto era un bucle que
            # al agotar los 3 intentos terminaba con exit 0. El job quedaba en
            # verde mientras el token recien rotado se perdia — y como el
            # refresh_token de Higgsfield ROTA EN CADA USO, el viejo ya estaba
            # muerto. La cadena se cortaba para siempre, en silencio.
            if [ "$OK" != "1" ]; then
              echo "::error::No se pudo guardar el estado tras 3 intentos. Si el token de Higgsfield roto en esta corrida, la cadena quedo ROTA: hay que re-loguear (higgsfield auth login + bash services/barbara/reauth.sh)."
              exit 1
            fi
          fi
