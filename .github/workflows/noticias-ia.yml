name: Noticias IA semanal

on:
  schedule:
    # Cada lunes a las 12:00 UTC (~8:00 am Chile / 7:00 am Perú)
      - cron: '0 12 * * 1'
  workflow_dispatch:   # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generar noticias de IA de la semana
        working-directory: apps/web-v2/public
        run: node ../../../services/noticias/noticias-ia.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit y push si hay cambios
        run: |
          git config user.name "condor-bot"
          git config user.email "bot@condorai.cl"
          git add apps/web-v2/public/assets/noticias-ia.json apps/web-v2/public/noticias-ia/
          if git diff --staged --quiet; then
            echo "Sin cambios esta semana"
          else
            git commit -m "chore: noticias IA semanal ($(date +%Y-%m-%d))"
            OK=0
            for n in 1 2 3; do
              if git pull --rebase origin main && git push; then OK=1; break; fi
              sleep 5
            done
            # EL BUG QUE ROMPIO A BARBARA EL 22-AGO: antes esto era un bucle que
            # al agotar los 3 intentos terminaba con exit 0. El job quedaba en
            # verde mientras el token recien rotado se perdia — y como el
            # refresh_token de Higgsfield ROTA EN CADA USO, el viejo ya estaba
            # muerto. La cadena se cortaba para siempre, en silencio.
            if [ "$OK" != "1" ]; then
              echo "::error::No se pudo guardar el estado tras 3 intentos. Si el token de Higgsfield roto en esta corrida, la cadena quedo ROTA: hay que re-loguear (higgsfield auth login + bash services/barbara/reauth.sh)."
              exit 1
            fi
          fi
