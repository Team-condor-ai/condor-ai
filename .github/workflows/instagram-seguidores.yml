name: Marketing — snapshot de seguidores de Instagram (cada 2 horas)

# Lee followers_count/follows_count de @condor.ai vía la API oficial de
# Instagram (Instagram Login, graph.instagram.com), los guarda en
# marketing_seguidores_snapshot, y verifica en cada corrida si la meta
# diaria de "seguir 200 cuentas" ya se cumplió de verdad (comparando el
# número real contra el de ayer) -- ver el comentario extenso en
# sincronizar-seguidores-instagram.mjs. Conectado el 3-sept-2026.
#
# CADA 2 HORAS, NO UNA VEZ AL DÍA (ajustado el mismo 3-sept)
# ---------------------------------------------------------------------------
# Pedido de Joaquín: que el casillero de la meta diaria se marque solo
# cuando el número real ya la alcanzó -- eso exige mirar el contador
# seguido durante el día, no una sola vez a las 5 AM antes de que nadie
# haya empezado a seguir cuentas todavía.
#
# El token se generó directo desde el panel de la app de Meta (no del
# Explorer genérico), lo que parece darle mayor duración -- ver el
# comentario extenso en sincronizar-seguidores-instagram.mjs. Si esta
# corrida empieza a fallar con un error de autenticación, generar uno
# nuevo desde ahí y actualizar INSTAGRAM_ACCESS_TOKEN acá Y
# api_credenciales (proveedor 'instagram') en Supabase -- las dos copias
# no se sincronizan solas.

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Guardar snapshot de seguidores
        run: node services/marketing/sincronizar-seguidores-instagram.mjs
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
