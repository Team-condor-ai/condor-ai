name: Barbara - entregar piezas pendientes

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      limite:
        description: "Máximo de entregas a reclamar"
        required: false
        default: "10"

permissions:
  contents: read

concurrency:
  group: barbara-entregador-pendientes
  cancel-in-progress: false

jobs:
  entregar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/barbara/package-lock.json
      - run: npm ci --prefix services/barbara
      - name: Entregar assets persistidos y confirmar IDs de Telegram
        run: node services/barbara/entregador-pendientes.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          LIMITE: ${{ inputs.limite || '10' }}
