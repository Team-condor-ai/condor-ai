name: Deploy Web (condorai.cl)

# Construye apps/web-v2 (Vite) y lo publica en GitHub Pages en cada push a
# main que toque la web. La SPA usa un 404.html = index.html para que las
# rutas del cliente (react-router) funcionen al refrescar.
on:
  push:
    branches: [main]
    paths:
      - 'apps/web-v2/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola publicación a la vez
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: apps/web-v2
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web-v2/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # Las VITE_* se leen en tiempo de BUILD, no en el navegador: si faltan
      # acá, el bundle sale sin Pixel y sin backend de leads y la campaña
      # corre a ciegas. Definirlas en Settings → Secrets → Actions.
      - name: Build (Vite)
        env:
          VITE_META_PIXEL_ID: ${{ secrets.VITE_META_PIXEL_ID }}
          VITE_LEADS_API: ${{ secrets.VITE_LEADS_API }}
        run: npm run build

      # Aviso temprano: sin estas dos la landing publica igual, pero no mide
      # conversiones ni guarda un solo lead. Mejor verlo en el log del deploy
      # que descubrirlo cuando la campaña ya gastó.
      - name: Revisar configuración de la campaña
        run: |
          [ -n "${{ secrets.VITE_META_PIXEL_ID }}" ] || echo "::warning::VITE_META_PIXEL_ID vacío — /colombia se publica SIN Meta Pixel."
          [ -n "${{ secrets.VITE_LEADS_API }}" ] || echo "::warning::VITE_LEADS_API vacío — el formulario de /colombia fallará y no guardará leads."
          test -f dist/colombia/index.html || { echo "::error::No se generó dist/colombia/index.html — /colombia volvería a responder 404."; exit 1; }

      # El 404.html lo escribe `scripts/prerender.mjs`, NO este paso.
      #
      # Antes acá se hacía `cp dist/index.html dist/404.html`. Desde que la
      # home es el sitio corporativo estático, esa copia dejaría a /planes
      # con la home como fallback y su router de React nunca montaría. El
      # prerender guarda la cáscara del SPA en 404.html ANTES de pisar el
      # index, que es el único orden que funciona.
      - name: Verificar el fallback del SPA y la home
        run: |
          test -f dist/404.html || { echo "::error::Falta dist/404.html — /planes respondería 404."; exit 1; }
          grep -q "root" dist/404.html || { echo "::error::dist/404.html no es la cáscara del SPA — /planes no montaría."; exit 1; }
          grep -q "rediseno/estilo.css" dist/index.html || { echo "::error::dist/index.html no es el sitio corporativo."; exit 1; }
          for r in productos compania equipo proceso clientes contacto; do
            test -f "dist/$r/index.html" || { echo "::error::Falta dist/$r/index.html"; exit 1; }
          done

      - uses: actions/configure-pages@v5

      - name: Subir el sitio (apps/web-v2/dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web-v2/dist

      - name: Desplegar a Pages
        id: deployment
        uses: actions/deploy-pages@v4
