name: Recalcular historial de campañas Meta

# Reescribe campaign-log.json con las conversaciones reales de Meta, para
# limpiar las entradas que quedaron infladas por el doble conteo corregido el
# 22-ago-2026. Simula por defecto.

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribir los cambios (sin esto solo simula)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  recalcular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recalcular
        run: node services/meta-analyzer/recalcular-log.mjs ${{ inputs.confirmar && '--confirmar' || '' }}
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
      - name: Guardar el historial corregido
        if: ${{ inputs.confirmar }}
        run: |
          git config user.name "condor-bot"
          git config user.email "bot@condorai.cl"
          if git diff --quiet services/meta-analyzer/campaign-log.json; then echo "sin cambios"; else
            git add services/meta-analyzer/campaign-log.json
            git commit -m "meta: recalcular historial con las conversaciones reales"
            OK=0
            for n in 1 2 3; do
              if git pull --rebase origin main && git push; then OK=1; break; fi
              sleep 5
            done
            # EL BUG QUE ROMPIO A BARBARA EL 22-AGO: antes esto era un bucle que
            # al agotar los 3 intentos terminaba con exit 0. El job quedaba en
            # verde mientras el token recien rotado se perdia — y como el
            # refresh_token de Higgsfield ROTA EN CADA USO, el viejo ya estaba
            # muerto. La cadena se cortaba para siempre, en silencio.
            if [ "$OK" != "1" ]; then
              echo "::error::No se pudo guardar el estado tras 3 intentos. Si el token de Higgsfield roto en esta corrida, la cadena quedo ROTA: hay que re-loguear (higgsfield auth login + bash services/barbara/reauth.sh)."
              exit 1
            fi
          fi
