name: Barbara - carruseles RRSS

on:
  schedule:
    # 3 piezas por semana, Lun/Mié/Vie (pedido de Joaquín 26-ago tarde-noche
    # -- probó diario unas horas esa misma tarde y bajó la cadencia).
    # 13:00 Chile = 17:00 UTC (Chile es UTC-4 todo el año, sin horario de
    # verano) -- 3 HORAS antes de la publicación automática de las 16:00
    # Chile (ver barbara-publicar-automatico.yml), para dejar tiempo de
    # revisar en Telegram y escribir "bloquear barbara" si algo no sirve.
      - cron: '0 17 * * 1,3,5'
  workflow_dispatch:
    inputs:
      dia:
        description: 'lunes | martes | miercoles | jueves | viernes | sabado | domingo | test  (vacío = según el día)'
        required: false
        default: ''
      retry:
        description: 'poner 1 para reintento (mejora el contenido)'
        required: false
        default: ''
      correccion:
        description: 'qué corregir de la pieza anterior (lo llena el bot de Telegram)'
        required: false
        default: ''
      solo_portada:
        description: 'poner 1 para generar SOLO la primera imagen (prueba barata de diseno)'
        required: false
        default: ''
      serie:
        description: 'forzar serie (vacío = la que toca por rotación)'
        required: false
        default: ''
        type: choice
        options: ['', 'noticias', 'servicios', 'barbara_producto', 'barbara_datos', 'ad_condor', 'ad_barbara']

permissions:
  contents: write

# El 23-ago se dispararon 4 corridas en 70 segundos. La primera paso; las otras
# tres chocaron entre si al escribir content-log.json, el rebase quedo en
# conflicto y ninguna pudo pushear. Como el refresh_token de Higgsfield ROTA EN
# CADA USO, un push perdido puede dejar la cadena muerta en silencio.
#
# cancel-in-progress: false a proposito — cancelar una corrida a medio camino
# quema creditos ya gastados y puede perder un token recien rotado. Se encolan.
concurrency:
  group: barbara-contenido-propio
  cancel-in-progress: false

jobs:
  barbara:
    runs-on: ubuntu-latest
    env:
      # Con la API oficial configurada, todo el andamiaje de OAuth (instalar el
      # CLI, descifrar el token, seleccionar workspace, re-cifrar el token
      # rotado) sobra: son ~40s por corrida y, sobre todo, superficie de falla
      # que ya tumbo a Barbara tres veces. Ver higgsfield-api.mjs.
      USA_API_HF: ${{ secrets.HIGGSFIELD_API_KEY_ID != '' }}
      # Migración 24-ago-2026: si hay KIE_API_KEY, ni el CLI ni la API oficial
      # de Higgsfield hacen falta — genImagen la prefiere. Ver kie-api.mjs.
      USA_KIE: ${{ secrets.KIE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Instalar dependencias (compone el logo real sobre lo que genera Higgsfield)
        # npm install podía tocar package-lock.json y dejar el árbol de git
        # sucio justo antes del "git pull --rebase" del último paso -- eso
        # rompió la corrida de verificación del 27-ago-2026 ("You have
        # unstaged changes"). npm ci nunca escribe el lockfile.
        working-directory: services/barbara
        run: npm ci
      - name: Instalar CLI de Higgsfield
        if: env.USA_API_HF != 'true' && env.USA_KIE != 'true'
        # PIN de versión a propósito: instalar @latest hacía que un release rompiente
        # (1.0.0, 27-jun-2026: workspace obligatorio + nuevo auth flow) tumbara a Barbara
        # sola. Subir de versión debe ser un cambio deliberado, no automático.
        #
        # Subido de 0.2.3 a 1.1.23 el 23-ago-2026, y esta vez SÍ era obligatorio:
        # el re-login del 23-ago se hizo con la 1.1.23 y escribió un
        # credentials.json con `auth_version: 2` — otro formato (access_token de
        # 36 chars, refresh de 48, más expires_at/token_type/scope). La 0.2.3 no
        # lo entiende. El paso de abajo que selecciona workspace ya estaba
        # preparado para la serie 1.x.
        run: npm install -g @higgsfield/cli@1.1.23
      - name: Autenticar Higgsfield (descifrar credenciales rotadas)
        if: env.USA_API_HF != 'true' && env.USA_KIE != 'true'
        env:
          HF_CREDS_KEY: ${{ secrets.HF_CREDS_KEY }}
          HF_ACCESS: ${{ secrets.HIGGSFIELD_ACCESS_TOKEN }}
          HF_REFRESH: ${{ secrets.HIGGSFIELD_REFRESH_TOKEN }}
          HF_WORKSPACE_ID: ${{ secrets.HIGGSFIELD_WORKSPACE_ID }}
        run: |
          mkdir -p ~/.config/higgsfield
          if [ -n "$HF_CREDS_KEY" ] && [ -f services/barbara/hf-creds.enc ]; then
            echo "Usando credenciales cifradas del repo (auto-rotación)."
            openssl enc -d -aes-256-cbc -pbkdf2 -salt -in services/barbara/hf-creds.enc -out ~/.config/higgsfield/credentials.json -pass pass:"$HF_CREDS_KEY"
          else
            echo "Fallback: credenciales desde secrets sueltos."
            printf '{"access_token":"%s","refresh_token":"%s"}' "$HF_ACCESS" "$HF_REFRESH" > ~/.config/higgsfield/credentials.json
          fi
          sha256sum ~/.config/higgsfield/credentials.json | awk '{print $1}' > /tmp/hf_before.sha
          # El CLI de Higgsfield ahora EXIGE un workspace seleccionado antes de generar
          # (antes generaba contra la cuenta privada por defecto). Esto rompió a Barbara
          # el 2026-06-29 con "No workspace selected". Lo seleccionamos de forma
          # auto-reparable: ID conocido y, si no, el primero de la cuenta del bot.
          # Al cambiar credentials.json, el paso de persistencia lo re-cifra en hf-creds.enc.
          # YA NO es best-effort: desde que CI usa la serie 1.x, el workspace es
          # OBLIGATORIO. El 23-ago-2026 la corrida fallo slide por slide con
          # workspace_membership_required porque el ID hardcodeado era el de la
          # cuenta VIEJA de Higgsfield (migrada el 22-ago) y este paso se lo
          # tragaba en silencio con un "Aviso:". Si no se puede seleccionar, el
          # job tiene que morir aca y no 15 minutos despues quemando reintentos.
          WS_ID="${HF_WORKSPACE_ID:-a269a272-1e58-4b90-b117-0419c44b475c}"
          if higgsfield workspace set "$WS_ID" >/dev/null 2>&1; then
            echo "Workspace seleccionado: $WS_ID"
          else
            WS_ID=$(higgsfield workspace list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const a=Array.isArray(j)?j:(j.workspaces||[]);process.stdout.write(String((a[0]&&(a[0].id||a[0].workspace_id))||""))}catch{process.stdout.write("")}})')
            if [ -n "$WS_ID" ] && higgsfield workspace set "$WS_ID" >/dev/null 2>&1; then
              echo "Workspace auto-seleccionado: $WS_ID"
            else
              echo "::error::No se pudo seleccionar workspace en Higgsfield. Con el CLI 1.x es obligatorio: sin esto toda generación falla con workspace_membership_required. Revisá el secret HIGGSFIELD_WORKSPACE_ID contra: higgsfield workspace list"
              exit 1
            fi
          fi
      - name: Generar carrusel y enviar a Telegram
        run: node services/barbara/barbara.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Kie.ai (gpt-image-2), key estática — genImagen la prefiere primero.
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
          # API oficial de Higgsfield: credenciales ESTATICAS, no caducan.
          # Fallback si no hay KIE_API_KEY.
          HIGGSFIELD_API_KEY_ID: ${{ secrets.HIGGSFIELD_API_KEY_ID }}
          HIGGSFIELD_API_KEY_SECRET: ${{ secrets.HIGGSFIELD_API_KEY_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIA: ${{ github.event.inputs.dia }}
          RETRY: ${{ github.event.inputs.retry }}
          SERIE: ${{ github.event.inputs.serie }}
          CORRECCION: ${{ github.event.inputs.correccion }}
          SOLO_PORTADA: ${{ github.event.inputs.solo_portada }}
          BARBARA_OUTBOX_DIR: barbara-outbox
          # Opcionales: sólo se usan para leer los playbooks (memoria
          # fundacional). Si faltan, barbara.mjs corre igual sin ellos.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Guardar pieza aprobable
        uses: actions/upload-artifact@v7
        with:
          name: barbara-${{ github.run_id }}
          path: barbara-outbox
          if-no-files-found: error
          retention-days: 30
      - name: Persistir credenciales rotadas + memoria
        if: always()
        env:
          HF_CREDS_KEY: ${{ secrets.HF_CREDS_KEY }}
        run: |
          git config user.name "barbara-bot"
          git config user.email "bot@condorai.cl"
          # Con la API oficial el CLI ni corre, asi que credentials.json no existe
          # y este bloque se salta solo. Se deja por si se vuelve al CLI.
          if [ "$USA_API_HF" != "true" ] && [ -n "$HF_CREDS_KEY" ] && [ -f ~/.config/higgsfield/credentials.json ]; then
            AFTER=$(sha256sum ~/.config/higgsfield/credentials.json | awk '{print $1}')
            BEFORE=$(cat /tmp/hf_before.sha 2>/dev/null || echo "")
            if [ "$AFTER" != "$BEFORE" ]; then
              echo "Token rotado: actualizando hf-creds.enc"
              openssl enc -aes-256-cbc -pbkdf2 -salt -in ~/.config/higgsfield/credentials.json -out services/barbara/hf-creds.enc -pass pass:"$HF_CREDS_KEY"
              git add services/barbara/hf-creds.enc
            fi
          fi
          git add services/barbara/content-log.json services/barbara/reglas-condor.json
          if git diff --staged --quiet; then echo "sin cambios"; else
            git commit -m "barbara: registro de contenido + token $(date +%Y-%m-%d)"
            OK=0
            for n in 1 2 3; do
              if git pull --rebase origin main && git push; then OK=1; break; fi
              sleep 5
            done
            # EL BUG QUE ROMPIO A BARBARA EL 22-AGO: antes esto era un bucle que
            # al agotar los 3 intentos terminaba con exit 0. El job quedaba en
            # verde mientras el token recien rotado se perdia — y como el
            # refresh_token de Higgsfield ROTA EN CADA USO, el viejo ya estaba
            # muerto. La cadena se cortaba para siempre, en silencio.
            if [ "$OK" != "1" ]; then
              echo "::error::No se pudo guardar el estado tras 3 intentos. Si el token de Higgsfield roto en esta corrida, la cadena quedo ROTA: hay que re-loguear (higgsfield auth login + bash services/barbara/reauth.sh)."
              exit 1
            fi
          fi
