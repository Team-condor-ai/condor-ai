name: Sincronizar egresos de Meta Ads

on:
  schedule:
    # Relee 35 dias: Meta puede ajustar el gasto reciente y el RPC actualiza,
    # no duplica, el asiento de cada campana/dia.
    - cron: "20 8 * * *"
  workflow_dispatch:
    inputs:
      dias:
        description: Dias hacia atras que se deben resincronizar
        required: false
        default: "90"

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Registrar gasto publicitario en Contabilidad
        run: node services/meta-analyzer/sincronizar-egresos.mjs --dias "${{ inputs.dias || '35' }}"
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
