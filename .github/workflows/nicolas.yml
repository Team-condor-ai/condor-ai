name: Nicolás — Reportes de ingresos

on:
  schedule:
    # Semanal: viernes a las 23:59 UTC
    - cron: '59 23 * * 5'
    # Mensual: día 1 a las 06:00 UTC. NO día 30 — ese día no existe en
    # febrero, así que el reporte mensual se saltaba ese mes entero. El día
    # 1 siempre existe y ya cerró el mes anterior completo, que es lo que
    # usa la sección F29 (mesCalendarioAnterior en nicolas.mjs).
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo del reporte'
        required: true
        default: 'semanal'
        type: choice
        options:
          - semanal
          - mensual

jobs:
  reporte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generar reporte
        run: node services/nicolas/nicolas.mjs
        env:
          NICOLAS_MODO: ${{ github.event.inputs.modo || (github.event.schedule == '0 6 1 * *' && 'mensual' || 'semanal') }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NICOLAS_TELEGRAM_BOT_TOKEN: ${{ secrets.NICOLAS_TELEGRAM_BOT_TOKEN }}
          NICOLAS_TELEGRAM_CHAT_ID: ${{ secrets.NICOLAS_TELEGRAM_CHAT_ID }}
          NICOLAS_SHEETS_URL: ${{ secrets.NICOLAS_SHEETS_URL }}
          NICOLAS_SHEETS_TOKEN: ${{ secrets.NICOLAS_SHEETS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
