name: Barbara - publicación automática 17:00

# Pedido explícito de Joaquín, 26-ago-2026 tarde (hora movida a las 17:00
# Chile el 28-ago-2026): el contenido propio de Cóndor se publica SOLO los
# mismos días que se genera (Lun/Mié/Vie, 17:00 Chile), salvo que alguien
# escriba "bloquear barbara" en el chat interno de Telegram en la ventana de
# 4h desde que se generó (13:00 Chile, ver barbara.yml). Este workflow es el
# que decide y dispara -- la lógica vive en publicar-automatico.mjs para
# poder probarla sin esperar al cron.
on:
  schedule:
    # 17:00 Chile = 21:00 UTC (Chile es UTC-4 todo el año, sin horario de
    # verano). Mismos días que la generación -- correr un martes no
    # encontraría nada y mandaría una alerta de "no hay pieza" sin sentido.
      - cron: '0 21 * * 1,3,5'
  workflow_dispatch: {}

permissions:
  actions: write   # necesario para disparar barbara-publicar-blotato.yml
  contents: read

concurrency:
  group: barbara-publicar-automatico
  cancel-in-progress: false

jobs:
  publicar-si-corresponde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/barbara/package-lock.json
      - name: Instalar dependencias
        # Faltaba este paso: motor.mjs importa sharp, y sin node_modules el
        # job moria con ERR_MODULE_NOT_FOUND antes de decidir nada (26-ago-2026).
        run: npm ci --prefix services/barbara
      - name: Decidir y disparar (o avisar por qué no)
        run: node services/barbara/publicar-automatico.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
