name: Barbara Reels - videos RRSS

on:
  schedule:
    # Mar(2) ugc (vocera habla, Veo 3.1) · Jue(4) trailer industria (Seedance 2.0) · 09:00 Chile = 13:00 UTC (invierno UTC-4; en verano UTC-3 serían 10:00)
      - cron: '0 13 * * 2,4'
  workflow_dispatch:
    inputs:
      tipo:
        description: 'ugc | trailer | test  (vacío = según el día)'
        required: false
        default: ''
      industria:
        description: 'forzar industria del trailer (opcional, ej: restaurante)'
        required: false
        default: ''
      retry:
        description: 'poner 1 para reintento'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  reels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ffmpeg (para unir clips)
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg ya disponible: $(ffmpeg -version | head -1)"
          else
            for n in 1 2 3; do
              sudo apt-get update && sudo apt-get install -y ffmpeg && break
              echo "apt falló (intento $n/3), reintentando en 15s…"; sleep 15
            done
            command -v ffmpeg >/dev/null 2>&1 || { echo "no se pudo instalar ffmpeg"; exit 1; }
          fi
      - name: Instalar CLI de Higgsfield
        # PIN de versión a propósito: instalar @latest hacía que un release rompiente
        # (1.0.0, 27-jun-2026: workspace obligatorio + nuevo auth flow) tumbara a Barbara
        # sola. Subir de versión debe ser un cambio deliberado, no automático.
        run: npm install -g @higgsfield/cli@0.2.3
      - name: Autenticar Higgsfield (descifrar credenciales rotadas)
        env:
          HF_CREDS_KEY: ${{ secrets.HF_CREDS_KEY }}
          HF_ACCESS: ${{ secrets.HIGGSFIELD_ACCESS_TOKEN }}
          HF_REFRESH: ${{ secrets.HIGGSFIELD_REFRESH_TOKEN }}
          HF_WORKSPACE_ID: ${{ secrets.HIGGSFIELD_WORKSPACE_ID }}
        run: |
          mkdir -p ~/.config/higgsfield
          if [ -n "$HF_CREDS_KEY" ] && [ -f services/barbara/hf-creds.enc ]; then
            echo "Usando credenciales cifradas del repo (auto-rotación)."
            openssl enc -d -aes-256-cbc -pbkdf2 -salt -in services/barbara/hf-creds.enc -out ~/.config/higgsfield/credentials.json -pass pass:"$HF_CREDS_KEY"
          else
            echo "Fallback: credenciales desde secrets sueltos."
            printf '{"access_token":"%s","refresh_token":"%s"}' "$HF_ACCESS" "$HF_REFRESH" > ~/.config/higgsfield/credentials.json
          fi
          sha256sum ~/.config/higgsfield/credentials.json | awk '{print $1}' > /tmp/hf_before.sha
          # El CLI de Higgsfield ahora EXIGE un workspace seleccionado antes de generar
          # (antes generaba contra la cuenta privada por defecto). Esto rompió a Barbara
          # el 2026-06-29 con "No workspace selected". Lo seleccionamos de forma
          # auto-reparable: ID conocido y, si no, el primero de la cuenta del bot.
          # Al cambiar credentials.json, el paso de persistencia lo re-cifra en hf-creds.enc.
          # Best-effort (nunca falla el job): 0.2.x NO exige workspace; sólo lo necesita
          # la serie 1.x. Si el día de mañana se sube de versión, esto ya lo deja listo.
          WS_ID="${HF_WORKSPACE_ID:-a2878df7-43e1-4685-acca-5be527026fc2}"
          if higgsfield workspace set "$WS_ID" >/dev/null 2>&1; then
            echo "Workspace seleccionado: $WS_ID"
          else
            WS_ID=$(higgsfield workspace list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const a=Array.isArray(j)?j:(j.workspaces||[]);process.stdout.write(String((a[0]&&(a[0].id||a[0].workspace_id))||""))}catch{process.stdout.write("")}})')
            if [ -n "$WS_ID" ] && higgsfield workspace set "$WS_ID" >/dev/null 2>&1; then
              echo "Workspace auto-seleccionado: $WS_ID"
            else
              echo "Aviso: no se seleccionó workspace (ok en CLI 0.2.x, que no lo requiere)."
            fi
          fi
      - name: Generar reel y enviar a Telegram
        run: node services/barbara/reels.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIPO: ${{ github.event.inputs.tipo }}
          RETRY: ${{ github.event.inputs.retry }}
          INDUSTRIA: ${{ github.event.inputs.industria }}
      - name: Persistir credenciales rotadas + memoria
        if: always()
        env:
          HF_CREDS_KEY: ${{ secrets.HF_CREDS_KEY }}
        run: |
          git config user.name "barbara-bot"
          git config user.email "bot@condorai.cl"
          # Si el CLI rotó el token (creds cambiaron), re-cifrar y commitear
          if [ -n "$HF_CREDS_KEY" ] && [ -f ~/.config/higgsfield/credentials.json ]; then
            AFTER=$(sha256sum ~/.config/higgsfield/credentials.json | awk '{print $1}')
            BEFORE=$(cat /tmp/hf_before.sha 2>/dev/null || echo "")
            if [ "$AFTER" != "$BEFORE" ]; then
              echo "Token rotado: actualizando hf-creds.enc"
              openssl enc -aes-256-cbc -pbkdf2 -salt -in ~/.config/higgsfield/credentials.json -out services/barbara/hf-creds.enc -pass pass:"$HF_CREDS_KEY"
              git add services/barbara/hf-creds.enc
            fi
          fi
          git add services/barbara/content-log.json
          if git diff --staged --quiet; then echo "sin cambios"; else
            git commit -m "barbara reels: registro + token $(date +%Y-%m-%d)"
            for n in 1 2 3; do git pull --rebase origin main && git push && break || sleep 5; done
          fi
